<!-- Tablas Clientes -->
<div class="row">
  <div class="col-12 grid-margin">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title">Clientes</h2>
        <div class="grid-margin">
          <button class="btn-lg btn-inverse-success" data-bs-toggle="modal" data-bs-target="#modalCrearClientes">
            <span><i class=" mdi mdi-plus"></i></span>   Agregar
            Cliente</button>
            <button class="btn-lg btn-inverse-info" onclick="ImprimirInformePdf()">
              <span><i class="mdi mdi-fax"></i></span>   Generar Informe</button>
        </div>
        <div class="table-responsive">
          <table id="clientes" class="table table-hover tabla-con-acciones">
            <thead>
              <tr>
                <th class="text-light">Nombre</th>
                <th class="text-light">D.N.I.</th>
                <th class="text-light">Email</th>
                <th class="text-light">Telefono</th>
                <th class="text-light">Observaciones</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="todosLosClientes">
              <!-- Aquí se llenará la tabla con JavaScript -->
            </tbody>
          </table>

          <!-- MODAL -->
          <div id="modalCrearClientes" class="modal fade" tabindex="-1" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title text-primary">Agregar Cliente</h5>
                </div>
                <div class="modal-body">
                  <div>

                    <!-- <input type="hidden" id="ClienteId"> -->

                    <label for="Nombre" class="form-label">Nombre</label>
                    <input type="text" id="Nombre" class="form-control text-light" placeholder="Nombre">

                    <label for="Dni" class="form-label">DNI</label>
                    <input type="number" id="Dni" class="form-control text-light" placeholder="DNI">

                    <label for="Email" class="form-label">Email</label>
                    <input type="email" id="Email" class="form-control text-light" placeholder="Email">

                    <label for="Telefono" class="form-label">Telefono</label>
                    <input type="tel" id="Telefono" class="form-control text-light" placeholder="Telefono">

                    <label for="Observaciones" class="form-label">Observaciones</label>
                    <textarea id="Observaciones" class="form-control text-light" placeholder="Observaciones"></textarea>

                    <span id="errorCliente" class="text-danger"></span>


                    <p id="errorCrear" hidden style="color:red"></p>

                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-inverse-warning" onclick="VaciarModalClientes()">Cancelar</button>
                  <button type="button" class="btn btn-inverse-primary" onclick="CrearCliente();">Guardar</button>
                </div>
              </div>
            </div>
          </div>


           <!-- MODAL editar -->
          <div id="modalEditarClientes" class="modal fade" tabindex="-1" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title text-primary">Editar Clientes</h5>
                </div>
                <div class="modal-body">
                  <div>

                    <input type="hidden" id="ClienteId">

                    <label for="NombreEditar" class="form-label">Nombre</label>
                    <input type="text" id="NombreEditar" class="form-control text-light">

                    <label for="DniEditar" class="form-label">DNI</label>
                    <input type="number" id="DniEditar" class="form-control text-light">

                    <label for="EmailEditar" class="form-label">Email</label>
                    <input type="email" id="EmailEditar" class="form-control text-light">

                    <label for="TelefonoEditar" class="form-label">Telefono</label>
                    <input type="tel" id="TelefonoEditar" class="form-control text-light">

                    <label for="ObservacionesEditar" class="form-label">Observaciones</label>
                    <textarea id="ObservacionesEditar" class="form-control text-light"></textarea>

                    <span id="errorCliente" class="text-danger"></span>


                    <p id="errorEditar" hidden style="color:red"></p>

                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-inverse-warning" onclick="VaciarModalClientes()">Cancelar</button>
                  <button type="button" class="btn btn-inverse-primary" onclick="EditarCliente();">Guardar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>



<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
