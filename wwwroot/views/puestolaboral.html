<!-- Tablas Puesto Laboral -->

<div class="row">
  <div class="col-12 grid-margin">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title">Puestos Laborales</h2>
        <div class="grid-margin">
          <button class="btn-lg btn-inverse-success" data-bs-toggle="modal" data-bs-target="#modalCrearPuestos">
            <span><i class="mdi mdi-plus"></i></span> Agregar
            Puesto Laboral</button>
            <span></span>
            <button class="btn-lg btn-inverse-info" onclick="imprimirPuestos()">
              <span><i class="mdi mdi-fax"></i></span>    Generar Informe</button>
        </div>
        <div class="table-responsive">
          <table id="puestos" class="table table-hover">
            <thead>
              <tr>
                <!-- <th> Id </th> -->
                <th class="text-light"> Nombre </th>
                <th class="text-light">Acciones</th>
              </tr>
            </thead>
            <tbody id="todosLosPuestos">
              <!-- Aquí se llenará la tabla con JavaScript -->
            </tbody>
          </table>

          <!-- MODAL -->
          <div id="modalCrearPuestos" class="modal fade" tabindex="-1" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title text-primary">Puestos Laborales</h5>
                </div>
                <div class="modal-body">
                  <div>

                    <input type="hidden" id="PuestoLaboralId">

                    <label for="DescripcionLaboral" class="form-label">Nombre</label>
                    <input type="text" id="DescripcionLaboral" class="form-control text-light" placeholder="Nombre">

                    <span id="errorPuesto" class="text-danger"></span>


                    <p id="errorCrearPuesto" hidden style="color:red"></p>

                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-inverse-warning" onclick="VaciarModal()">Cancelar</button>
                  <button type="button" class="btn btn-inverse-primary" onclick="GuardarPuesto();">Guardar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
